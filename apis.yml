name: Everdream
description: Everdream Corporation was an on-demand desktop and IT asset management SaaS provider founded
  in 1998 and headquartered in Fremont, California. It offered hosted remote management, monitoring, and
  security services that gave organizations visibility into their hardware and software assets over the
  internet. Backed by Canaan Partners and other venture investors, Everdream was acquired by Dell in
  December 2007 and folded into Dell's managed-services offerings. The company is defunct; the everdream.com
  domain is now parked and listed for sale, and there is no active public API, developer portal, or
  documentation surface to enrich.
